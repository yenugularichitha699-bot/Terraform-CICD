<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Terraform CI/CD Demo</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            text-align: center;
            margin-top: 100px;
        }

        .container {
            background: white;
            padding: 30px;
            width: 60%;
            margin: auto;
            border-radius: 10px;
            box-shadow: 0px 0px 10px rgba(0,0,0,0.2);
        }

        h1 {
            color: #0078D7;
        }

        p {
            font-size: 18px;
        }

        .success {
            color: green;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>🚀 Terraform CI/CD Demo</h1>

        <p>This application was deployed using:</p>

        <ul style="list-style:none;">
            <li>✅ GitHub Actions</li>
            <li>✅ Terraform</li>
            <li>✅ AWS</li>
            <li>✅ CI/CD Pipeline</li>
        </ul>

        <p class="success">
            Deployment Successful!
        </p>
    </div>

</body>
</html>
